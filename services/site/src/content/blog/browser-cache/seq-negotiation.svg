<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="title desc">
  <title id="title">协商缓存时序：第二次访问只回 304</title>
  <desc id="desc">浏览器首次请求脚本，服务器返回 200 与 ETag。新鲜期结束后再次请求，带上 If-None-Match；服务器比较后返回 304，没有响应体，浏览器读取本地副本。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7683"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" rx="14" fill="#fbfbfb"/>

  <rect x="120" y="26" width="200" height="46" rx="8" fill="#eef4fb" stroke="#c9d8e9"/>
  <text x="220" y="55" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2b3138">浏览器</text>

  <rect x="580" y="26" width="200" height="46" rx="8" fill="#eef4fb" stroke="#c9d8e9"/>
  <text x="680" y="55" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2b3138">服务器</text>

  <line x1="220" y1="72" x2="220" y2="490" stroke="#c9d0d8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="680" y1="72" x2="680" y2="490" stroke="#c9d0d8" stroke-width="1.2" stroke-dasharray="5 5"/>

  <line x1="220" y1="120" x2="672" y2="120" stroke="#6b7683" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450" y="110" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#2b3138">① GET /script.js</text>

  <line x1="680" y1="172" x2="228" y2="172" stroke="#6b7683" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450" y="162" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#2b3138">② 200 OK · ETag: "xyz123"</text>

  <rect x="150" y="206" width="600" height="40" rx="6" fill="#f7f8fa" stroke="#e2e6ea" stroke-dasharray="4 4"/>
  <text x="450" y="231" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5b6672">新鲜期结束，用户再次访问</text>

  <line x1="220" y1="286" x2="672" y2="286" stroke="#6b7683" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450" y="276" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#2b3138">③ GET /script.js · If-None-Match: "xyz123"</text>

  <line x1="680" y1="340" x2="228" y2="340" stroke="#6b7683" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450" y="330" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#2b3138">④ 304 Not Modified（无响应体）</text>

  <rect x="120" y="392" width="330" height="62" rx="8" fill="#eef6f0" stroke="#c6ddcd"/>
  <text x="285" y="416" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#2b3138">⑤ 读本地副本</text>
  <text x="285" y="436" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#4a6b55">并用 304 的头部更新缓存记录</text>

  <text x="690" y="392" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9aa6b2">省下的是响应体</text>
  <text x="690" y="410" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9aa6b2">往返仍在</text>
</svg>
