<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc">
  <title id="title">强缓存时序：第二次访问不发请求</title>
  <desc id="desc">浏览器首次请求样式表，服务器返回 200 与 Cache-Control: max-age=3600。十分钟后用户再次访问，浏览器发现副本仍在新鲜期内，直接读本地缓存，不向服务器发送请求。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7683"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="470" rx="14" fill="#fbfbfb"/>

  <rect x="120" y="26" width="200" height="46" rx="8" fill="#eef4fb" stroke="#c9d8e9"/>
  <text x="220" y="55" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2b3138">浏览器</text>

  <rect x="580" y="26" width="200" height="46" rx="8" fill="#eef4fb" stroke="#c9d8e9"/>
  <text x="680" y="55" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2b3138">服务器</text>

  <line x1="220" y1="72" x2="220" y2="440" stroke="#c9d0d8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="680" y1="72" x2="680" y2="440" stroke="#c9d0d8" stroke-width="1.2" stroke-dasharray="5 5"/>

  <line x1="220" y1="128" x2="672" y2="128" stroke="#6b7683" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450" y="118" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#2b3138">① GET /style.css</text>

  <line x1="680" y1="186" x2="228" y2="186" stroke="#6b7683" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450" y="176" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#2b3138">② 200 OK · Cache-Control: max-age=3600</text>

  <rect x="150" y="226" width="600" height="40" rx="6" fill="#f7f8fa" stroke="#e2e6ea" stroke-dasharray="4 4"/>
  <text x="450" y="251" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5b6672">10 分钟后，用户再次访问</text>

  <path d="M 220 306 h 46 v 30 h -38" stroke="#c08a2e" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="284" y="318" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8a6a2a">③ 本地副本仍在新鲜期内</text>

  <rect x="120" y="372" width="330" height="50" rx="8" fill="#eef6f0" stroke="#c6ddcd"/>
  <text x="285" y="394" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#2b3138">④ 直接读缓存</text>
  <text x="285" y="412" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#4a6b55">不发请求，DevTools 显示 from disk cache</text>

  <text x="690" y="300" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9aa6b2">服务器不参与</text>
</svg>
