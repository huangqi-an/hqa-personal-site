<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" role="img" aria-labelledby="title desc">
  <title id="title">浏览器的缓存判定流程</title>
  <desc id="desc">请求先在本地查缓存条目：没有条目则发完整请求并存入；有条目且仍新鲜则直接使用、不发请求；已过期时，若有校验器就发条件请求，服务器内容未变返回 304 复用本地副本，已变则返回 200 替换条目；没有校验器则直接发完整请求。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa6b2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="680" rx="14" fill="#fbfbfb"/>

  <!-- 起点 -->
  <rect x="160" y="35" width="180" height="50" rx="25" fill="#ffffff" stroke="#d8dde3"/>
  <text x="250" y="65" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#2b3138">GET /app.js</text>

  <!-- 判定 1：有没有条目 -->
  <polygon points="250,120 350,160 250,200 150,160" fill="#eef4fb" stroke="#c9d8e9"/>
  <text x="250" y="156" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2b3138">缓存里有</text>
  <text x="250" y="174" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2b3138">匹配的条目？</text>

  <!-- 判定 2：新鲜度 -->
  <polygon points="250,250 350,290 250,330 150,290" fill="#eef4fb" stroke="#c9d8e9"/>
  <text x="250" y="286" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2b3138">还新鲜？</text>
  <text x="250" y="304" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#5b6672">age &lt; lifetime</text>

  <!-- 判定 3：有没有校验器 -->
  <polygon points="250,380 350,420 250,460 150,420" fill="#eef4fb" stroke="#c9d8e9"/>
  <text x="250" y="416" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2b3138">有校验器？</text>
  <text x="250" y="434" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#5b6672">ETag / Last-Modified</text>

  <!-- 条件请求 -->
  <rect x="130" y="515" width="240" height="60" rx="10" fill="#fdf6e9" stroke="#ecd9b0"/>
  <text x="250" y="539" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2b3138">发条件请求</text>
  <text x="250" y="559" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#5b6672">If-None-Match / If-Modified-Since</text>

  <!-- 结果：200 下载并存入 -->
  <rect x="525" y="125" width="230" height="70" rx="10" fill="#fdf6e9" stroke="#ecd9b0"/>
  <text x="640" y="152" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#2b3138">200 下载并存入</text>
  <text x="640" y="174" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6672">这是首次访问</text>

  <!-- 结果：直接用 -->
  <rect x="525" y="255" width="230" height="70" rx="10" fill="#eef6f0" stroke="#c6ddcd"/>
  <text x="640" y="282" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#2b3138">直接用本地副本</text>
  <text x="640" y="304" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#4a6b55">不发请求，零往返</text>

  <!-- 结果：200 直接返回 -->
  <rect x="525" y="385" width="230" height="70" rx="10" fill="#fdf6e9" stroke="#ecd9b0"/>
  <text x="640" y="412" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#2b3138">200 直接返回</text>
  <text x="640" y="434" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6672">没有校验器可用</text>

  <!-- 结果：304 / 200 -->
  <rect x="515" y="520" width="250" height="95" rx="10" fill="#eef6f0" stroke="#c6ddcd"/>
  <text x="640" y="547" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#2b3138">304 复用本地副本</text>
  <text x="640" y="569" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#4a6b55">没有 body，只刷新头部</text>
  <text x="640" y="594" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6672">若内容已变 → 200 替换条目</text>

  <!-- 连线 -->
  <path d="M 250 85 L 250 120" stroke="#9aa6b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <path d="M 350 160 L 525 160" stroke="#9aa6b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="437" y="151" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6672">否</text>

  <path d="M 250 200 L 250 250" stroke="#9aa6b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="260" y="230" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6672">是</text>

  <path d="M 350 290 L 525 290" stroke="#9aa6b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="437" y="281" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6672">是</text>

  <path d="M 250 330 L 250 380" stroke="#9aa6b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="260" y="360" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6672">否</text>

  <path d="M 350 420 L 525 420" stroke="#9aa6b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="437" y="411" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6672">否</text>

  <path d="M 250 460 L 250 515" stroke="#9aa6b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="260" y="493" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6672">是</text>

  <path d="M 370 545 L 450 545 L 450 567 L 515 567" stroke="#9aa6b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
</svg>
