# ─────────────────────────────────────────────────────────────────────
# 个人站（Astro SSR）生产定义
#
# 只声明生产运行需要的那一个容器。本地开发工作流（构建 / 预览 / dev）
# 在上游自带的 compose.dev.yml 里，两者不要混用：
#   docker compose up -d site                       # 生产
#   docker compose -f compose.dev.yml --profile dev up   # 本地开发
#
# 不声明 ports：只经入口层 nginx 访问，宿主机与公网都不可直达。
# ─────────────────────────────────────────────────────────────────────

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site
    # ↑ 固定容器名 = web-net 内的 DNS 名，nginx 直接写 http://site:4321

    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 显式声明监听地址：只监听 127.0.0.1 的话 nginx 反代会 502
      HOST: 0.0.0.0
      PORT: 4321
      # 网页宠物（大肥鱼）的 DeepSeek key。值来自仓库根 .env 的变量插值；
      # 没配就是空串，API 路由自动降级本地台词池，不构成硬依赖。
      # 刻意不用 env_file: .env——文件不存在会让整份编排解析失败（架构文档 §9.5）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

    networks:
      - web-net

    mem_limit: 256m
    # ↑ 实测常驻约 100~150MB，留出构建缓存与图片处理的余量（见架构文档 §7）

    healthcheck:
      # node:22-slim 里没有 wget / curl，用 node 自带的 fetch 探活
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      # 比 nginx 长：Node 冷启动要读配置、初始化 sharp，太快容易假失败
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web-net:
    external: true
